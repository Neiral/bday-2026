<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Challenge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 75% 25%, rgba(255, 198, 216, 0.48), transparent 32%),
                radial-gradient(circle at 15% 80%, rgba(255, 220, 231, 0.7), transparent 35%),
                linear-gradient(135deg, #fffafc 0%, #fff1f6 48%, #fff8fb 100%);
            color: #33272c;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 50%, transparent 35%, rgba(120, 50, 80, 0.035) 100%);
        }

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 11vw;
            gap: 8vw;
        }

        /* =========================
           LEFT SIDE
        ========================= */

        .intro {
            width: 46%;
            max-width: 620px;
            animation: introIn 1s cubic-bezier(.2, .8, .2, 1) forwards;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            color: #b76c86;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 30px;
            height: 1px;
            background: #d797ac;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(48px, 5vw, 76px);
            line-height: 0.98;
            font-weight: 400;
            letter-spacing: -0.045em;
            color: #3a292f;
            margin-bottom: 28px;
        }

        h1 span {
            color: #bd708b;
        }

        .description {
            max-width: 470px;
            color: #806a72;
            font-size: 16px;
            line-height: 1.8;
        }

        .attempt-note {
            margin-top: 34px;
            color: #a48790;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* =========================
           LOCK / STATUS
        ========================= */

        .status {
            margin-top: 18px;
            min-height: 20px;
            color: #b56a82;
            font-size: 13px;
            transition: opacity 0.3s ease;
        }

        /* =========================
           KEYPAD
        ========================= */

        .console {
            width: 390px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            animation: consoleIn 1s cubic-bezier(.2, .8, .2, 1) 0.12s both;
        }

        .keypad-card {
            width: 350px;
            padding: 30px 30px 32px;
            border: 1px solid rgba(210, 153, 172, 0.22);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.62);
            box-shadow:
                0 28px 70px rgba(144, 76, 100, 0.10),
                0 8px 25px rgba(144, 76, 100, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition:
                opacity 0.7s ease,
                transform 0.7s cubic-bezier(.2, .8, .2, 1),
                filter 0.7s ease;
        }

        .card-label {
            text-align: center;
            color: #ad8290;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .display {
            height: 76px;
            border-radius: 18px;
            background: rgba(250, 239, 244, 0.72);
            border: 1px solid rgba(202, 143, 162, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            transition: transform 0.25s ease;
        }

        .dots {
            display: flex;
            gap: 13px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #bd718b;
            opacity: 0.22;
            transform: scale(0.8);
            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .dot.active {
            opacity: 1;
            transform: scale(1);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key {
            height: 58px;
            border: 1px solid rgba(198, 145, 162, 0.18);
            border-radius: 17px;
            background: rgba(255, 255, 255, 0.76);
            color: #4c3941;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow:
                0 4px 10px rgba(130, 70, 90, 0.04);
            transition:
                transform 0.14s ease,
                background 0.14s ease,
                box-shadow 0.14s ease;
        }

        .key:hover {
            background: rgba(255, 244, 248, 0.95);
            box-shadow: 0 7px 18px rgba(130, 70, 90, 0.08);
            transform: translateY(-1px);
        }

        .key:active {
            transform: scale(0.94);
        }

        .key.action {
            color: #b06b83;
            font-size: 18px;
        }

        .key.disabled {
            opacity: 0.35;
            cursor: default;
            pointer-events: none;
        }

        /* =========================
           SHAKE
        ========================= */

        .shake {
            animation: shake 0.42s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-8px);
            }
            40% {
                transform: translateX(8px);
            }
            60% {
                transform: translateX(-6px);
            }
            80% {
                transform: translateX(5px);
            }
        }

        /* =========================
           SUCCESS
        ========================= */

        .success {
            position: absolute;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(18px) scale(0.97);
            transition:
                opacity 0.7s ease,
                transform 0.7s cubic-bezier(.2, .8, .2, 1);
        }

        .success.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .success-gif {
            width: 260px;
            max-height: 250px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 24px;
            filter: drop-shadow(0 15px 30px rgba(145, 69, 95, 0.12));
            padding-bottom: 50px;
        }

        .success-text {
            font-family: Georgia, "Times New Roman", serif;
            color: #a95472;
            font-size: 27px;
            font-weight: 400;
            letter-spacing: -0.02em;
            text-align: center;
            padding-bottom: 500px;
        }

        .success-subtext {
            margin-top: 9px;
            color: #a88892;
            font-size: 11px;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            padding-bottom: 150px;
        }

        /* =========================
           LOCKED STATE
        ========================= */

        .locked-message {
            text-align: center;
            padding: 15px 0;
        }

        .locked-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
            color: #6d505b;
            margin-bottom: 9px;
        }

        .countdown {
            color: #b56c84;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* =========================
           TRANSITION OUT
        ========================= */

        body.leaving .page {
            opacity: 0;
            transform: scale(0.985);
            filter: blur(5px);
            transition:
                opacity 0.8s ease,
                transform 0.8s ease,
                filter 0.8s ease;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {
            html,
            body {
                overflow: auto;
            }

            .page {
                min-height: 100%;
                padding: 70px 30px;
                flex-direction: column;
                justify-content: center;
                gap: 55px;
            }

            .intro {
                width: 100%;
                text-align: center;
            }

            .eyebrow {
                justify-content: center;
            }

            .description {
                margin: auto;
            }

            .attempt-note,
            .status {
                text-align: center;
            }

            .console {
                width: 100%;
            }
        }

        @keyframes introIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes consoleIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- LEFT -->
        <section class="intro">
            <div class="eyebrow">A little challenge</div>

            <h1>
                Try to guess<br>
                the password to<br>
                <span>my tablet.</span>
            </h1>

            <p class="description">
                Somewhere in those four little numbers is the key.
                You have five attempts. Choose wisely.
            </p>

            <p class="attempt-note" id="attemptText">
                5 attempts remaining
            </p>

            <p class="status" id="status"></p>
        </section>


        <!-- RIGHT -->
        <section class="console">

            <!-- KEYPAD -->
            <div class="keypad-card" id="keypadCard">

                <div class="card-label">
                    Enter passcode
                </div>

                <div class="display" id="display">
                    <div class="dots">
                        <span class="dot" id="dot1"></span>
                        <span class="dot" id="dot2"></span>
                        <span class="dot" id="dot3"></span>
                        <span class="dot" id="dot4"></span>
                    </div>
                </div>

                <div class="keypad">

                    <button class="key" data-number="1">1</button>
                    <button class="key" data-number="2">2</button>
                    <button class="key" data-number="3">3</button>

                    <button class="key" data-number="4">4</button>
                    <button class="key" data-number="5">5</button>
                    <button class="key" data-number="6">6</button>

                    <button class="key" data-number="7">7</button>
                    <button class="key" data-number="8">8</button>
                    <button class="key" data-number="9">9</button>

                    <button class="key action" id="clearButton">⌫</button>
                    <button class="key" data-number="0">0</button>
                    <button class="key action" id="enterButton">✓</button>

                </div>
            </div>


            <!-- SUCCESS -->
            <div class="success" id="success">

                <img
                    src="tenor.gif"
                    alt="Success"
                    class="success-gif"
                >

                <div class="success-text">
                    MWAHHHHHH GOODGIRL
                </div>

                <div class="success-subtext">
                    Password unlocked
                </div>

            </div>

        </section>

    </main>


    <script>
        /* =========================================
           SETTINGS
        ========================================= */

        const CORRECT_PASSWORD = "2309";
        const MAX_ATTEMPTS = 5;

        // 5 minutes in milliseconds
        const LOCK_TIME = 5 * 60 * 1000;

        // Time shown after a successful unlock
        const SUCCESS_DELAY = 3200;


        /* =========================================
           ELEMENTS
        ========================================= */

        const keypadCard = document.getElementById("keypadCard");
        const success = document.getElementById("success");
        const display = document.getElementById("display");

        const attemptText = document.getElementById("attemptText");
        const status = document.getElementById("status");

        const clearButton = document.getElementById("clearButton");
        const enterButton = document.getElementById("enterButton");

        const numberButtons = document.querySelectorAll("[data-number]");

        const dots = [
            document.getElementById("dot1"),
            document.getElementById("dot2"),
            document.getElementById("dot3"),
            document.getElementById("dot4")
        ];


        /* =========================================
           STATE
        ========================================= */

        let enteredCode = "";
        let attempts = Number(localStorage.getItem("page7_attempts")) || 0;
        let lockedUntil = Number(localStorage.getItem("page7_locked_until")) || 0;

        let countdownInterval = null;


        /* =========================================
           DISPLAY
        ========================================= */

        function updateDisplay() {
            dots.forEach((dot, index) => {
                if (index < enteredCode.length) {
                    dot.classList.add("active");
                } else {
                    dot.classList.remove("active");
                }
            });
        }


        /* =========================================
           ATTEMPTS
        ========================================= */

        function updateAttempts() {
            const remaining = Math.max(0, MAX_ATTEMPTS - attempts);

            if (remaining === 1) {
                attemptText.textContent = "1 attempt remaining";
            } else {
                attemptText.textContent = `${remaining} attempts remaining`;
            }
        }


        /* =========================================
           NUMBER ENTRY
        ========================================= */

        function addNumber(number) {

            if (isLocked()) {
                return;
            }

            if (enteredCode.length >= 4) {
                return;
            }

            enteredCode += number;

            updateDisplay();

            // Automatically check once four digits are entered.
            if (enteredCode.length === 4) {
                setTimeout(checkPassword, 180);
            }
        }


        /* =========================================
           DELETE
        ========================================= */

        function deleteNumber() {

            if (isLocked()) {
                return;
            }

            if (enteredCode.length === 0) {
                return;
            }

            enteredCode = enteredCode.slice(0, -1);

            updateDisplay();
        }


        /* =========================================
           PASSWORD CHECK
        ========================================= */

        function checkPassword() {

            if (isLocked()) {
                return;
            }

            if (enteredCode.length !== 4) {
                return;
            }

            if (enteredCode === CORRECT_PASSWORD) {
                unlockSuccess();
                return;
            }

            // Wrong password
            attempts++;

            localStorage.setItem("page7_attempts", attempts);

            keypadCard.classList.remove("shake");

            // Force animation restart
            void keypadCard.offsetWidth;

            keypadCard.classList.add("shake");

            setTimeout(() => {
                enteredCode = "";
                updateDisplay();
            }, 220);

            if (attempts >= MAX_ATTEMPTS) {
                startLock();
            } else {
                const remaining = MAX_ATTEMPTS - attempts;

                if (remaining === 1) {
                    status.textContent = "That was not it... one attempt left.";
                } else {
                    status.textContent = `Nope. ${remaining} attempts left.`;
                }

                updateAttempts();
            }
        }


        /* =========================================
           SUCCESS
        ========================================= */

        function unlockSuccess() {

            // Disable keypad immediately
            disableKeypad();

            status.textContent = "";

            keypadCard.style.opacity = "0";
            keypadCard.style.transform = "scale(0.96) translateY(-8px)";
            keypadCard.style.filter = "blur(4px)";

            setTimeout(() => {
                keypadCard.style.display = "none";

                success.classList.add("show");
            }, 420);

            setTimeout(() => {
                document.body.classList.add("leaving");

                setTimeout(() => {
                    window.location.href = "page21.html?from=7";
                }, 800);

            }, SUCCESS_DELAY);
        }


        /* =========================================
           LOCK SYSTEM
        ========================================= */

        function startLock() {

            const lockEnd = Date.now() + LOCK_TIME;

            lockedUntil = lockEnd;

            localStorage.setItem(
                "page7_locked_until",
                lockedUntil
            );

            updateLockScreen();
        }


        function isLocked() {

            if (lockedUntil === 0) {
                return false;
            }

            if (Date.now() >= lockedUntil) {
                unlockFromLock();
                return false;
            }

            return true;
        }


        function unlockFromLock() {

            lockedUntil = 0;
            attempts = 0;

            localStorage.removeItem("page7_locked_until");
            localStorage.setItem("page7_attempts", "0");

            enableKeypad();

            status.textContent = "";
            updateAttempts();
        }


        function updateLockScreen() {

            disableKeypad();

            const remainingTime = Math.max(
                0,
                lockedUntil - Date.now()
            );

            if (remainingTime <= 0) {
                unlockFromLock();
                return;
            }

            const totalSeconds = Math.ceil(
                remainingTime / 1000
            );

            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            const formattedSeconds =
                String(seconds).padStart(2, "0");

            attemptText.textContent = "All attempts used";

            status.innerHTML = `
                <span style="display:block;margin-bottom:6px;">
                    Locked for a little while.
                </span>
                <span style="
                    font-size:11px;
                    letter-spacing:.12em;
                    text-transform:uppercase;
                    opacity:.75;
                ">
                    Try again in ${minutes}:${formattedSeconds}
                </span>
            `;
        }


        function startCountdown() {

            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            countdownInterval = setInterval(() => {

                if (!isLocked()) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    return;
                }

                updateLockScreen();

            }, 1000);
        }


        /* =========================================
           ENABLE / DISABLE KEYPAD
        ========================================= */

        function disableKeypad() {

            numberButtons.forEach(button => {
                button.classList.add("disabled");
            });

            clearButton.classList.add("disabled");
            enterButton.classList.add("disabled");
        }


        function enableKeypad() {

            numberButtons.forEach(button => {
                button.classList.remove("disabled");
            });

            clearButton.classList.remove("disabled");
            enterButton.classList.remove("disabled");
        }


        /* =========================================
           BUTTON EVENTS
        ========================================= */

        numberButtons.forEach(button => {

            button.addEventListener("click", () => {

                const number = button.dataset.number;

                addNumber(number);
            });

        });


        clearButton.addEventListener("click", () => {
            deleteNumber();
        });


        enterButton.addEventListener("click", () => {
            checkPassword();
        });


        /* =========================================
           OPTIONAL DESKTOP KEYBOARD SUPPORT
        ========================================= */

        document.addEventListener("keydown", event => {

            if (isLocked()) {
                return;
            }

            // Number keys
            if (/^[0-9]$/.test(event.key)) {

                addNumber(event.key);

                return;
            }

            // Backspace
            if (event.key === "Backspace") {

                deleteNumber();

                return;
            }

            // Enter
            if (event.key === "Enter") {

                checkPassword();

                return;
            }

            // Escape clears the current input
            if (event.key === "Escape") {

                enteredCode = "";

                updateDisplay();
            }
        });


        /* =========================================
           INITIALIZATION
        ========================================= */

        updateAttempts();
        updateDisplay();


        // Check whether a previous lock is still active.
        if (isLocked()) {

            updateLockScreen();
            startCountdown();

        } else {

            enableKeypad();
        }
    </script>

</body>
</html>
