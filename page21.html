<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Coin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(255, 220, 160, 0.07),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 50% 80%,
                    rgba(255, 180, 90, 0.035),
                    transparent 35%
                ),
                #080807;

            color: #f3eee5;

            font-family:
                "Inter",
                "Segoe UI",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* =========================================================
           ATMOSPHERE
        ========================================================= */

        .scene {
            position: relative;
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            isolation: isolate;
        }

        .vignette {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(0, 0, 0, 0.25) 70%,
                    rgba(0, 0, 0, 0.72) 100%
                );

            z-index: 20;
        }

        .ambient-glow {
            position: absolute;

            width: 45vw;
            height: 45vw;

            min-width: 320px;
            min-height: 320px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 215, 150, 0.055),
                    rgba(255, 190, 100, 0.015) 42%,
                    transparent 70%
                );

            filter: blur(15px);

            opacity: 0.8;

            pointer-events: none;

            animation: breathe 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%,
            100% {
                transform: scale(0.96);
                opacity: 0.62;
            }

            50% {
                transform: scale(1.04);
                opacity: 0.9;
            }
        }

        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .content {
            position: relative;

            width: min(92vw, 760px);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            z-index: 10;

            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 0.42em;
            text-transform: uppercase;

            color: rgba(243, 238, 229, 0.42);

            margin-bottom: 18px;

            opacity: 0;
            transform: translateY(12px);

            animation: reveal 1s 0.15s forwards;
        }

        .title {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(42px, 7vw, 78px);

            font-weight: 400;

            line-height: 0.95;

            letter-spacing: -0.035em;

            color: #f4eee3;

            margin-bottom: 18px;

            opacity: 0;
            transform: translateY(20px);

            animation: reveal 1s 0.3s forwards;
        }

        .subtitle {
            max-width: 490px;

            font-size:
                clamp(13px, 1.7vw, 16px);

            line-height: 1.7;

            font-weight: 400;

            color: rgba(243, 238, 229, 0.52);

            margin-bottom: 48px;

            opacity: 0;
            transform: translateY(15px);

            animation: reveal 1s 0.45s forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           CHOICE
        ========================================================= */

        .choice-area {
            width: 100%;

            opacity: 0;
            transform: translateY(18px);

            animation: reveal 1s 0.6s forwards;
        }

        .choice-label {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;

            color: rgba(243, 238, 229, 0.3);

            margin-bottom: 18px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 14px;

            width: 100%;
        }

        .choice {
            position: relative;

            width: 170px;
            height: 58px;

            border: 1px solid rgba(243, 238, 229, 0.12);
            border-radius: 100px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.045),
                    rgba(255, 255, 255, 0.012)
                );

            color: rgba(243, 238, 229, 0.72);

            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;

            cursor: pointer;

            transition:
                transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease,
                background 0.35s ease,
                color 0.35s ease,
                box-shadow 0.35s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .choice::before {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: inherit;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255, 220, 160, 0.1),
                    transparent 65%
                );

            opacity: 0;

            transition: opacity 0.35s ease;
        }

        .choice:hover {
            transform: translateY(-3px);

            border-color:
                rgba(243, 238, 229, 0.27);

            color: #fffaf0;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.02)
                );

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .choice:hover::before {
            opacity: 1;
        }

        .choice:active {
            transform: translateY(-1px) scale(0.98);
        }

        .choice.selected {
            border-color:
                rgba(255, 215, 150, 0.45);

            color: #fff5df;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 215, 150, 0.1),
                    rgba(255, 215, 150, 0.025)
                );

            box-shadow:
                0 0 35px rgba(255, 205, 130, 0.06);
        }

        /* =========================================================
           COIN STAGE
        ========================================================= */

        .coin-stage {
            position: absolute;

            width: 100%;
            height: 100%;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;

            opacity: 0;

            z-index: 5;

            transition: opacity 0.8s ease;
        }

        .coin-stage.active {
            opacity: 1;
        }

        .coin-stage.hidden {
            opacity: 0;
        }

        .coin-light {
            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 219, 150, 0.1),
                    rgba(255, 205, 130, 0.025) 45%,
                    transparent 70%
                );

            filter: blur(15px);

            opacity: 0;

            transition: opacity 1s ease;
        }

        .coin-stage.active .coin-light {
            opacity: 1;
        }

        .coin-shadow {
            position: absolute;

            width: 170px;
            height: 34px;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);

            filter: blur(18px);

            transform:
                translateY(135px)
                scale(0.75);

            opacity: 0;

            transition: opacity 0.8s ease;
        }

        .coin-stage.active .coin-shadow {
            opacity: 1;
        }

        /* =========================================================
           3D COIN
        ========================================================= */

        .coin-camera {
            position: relative;

            width: 150px;
            height: 150px;

            perspective: 900px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin {
            position: relative;

            width: 132px;
            height: 132px;

            transform-style: preserve-3d;

            will-change: transform;

            opacity: 0;
        }

        .coin.show {
            opacity: 1;
        }

        .coin-face {
            position: absolute;

            width: 132px;
            height: 132px;

            left: 0;
            top: 0;

            border-radius: 50%;

            backface-visibility: hidden;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                4px solid #b9823d;

            background:
                radial-gradient(
                    circle at 35% 28%,
                    #f7dca1 0%,
                    #d9aa62 27%,
                    #a96f31 58%,
                    #75451d 100%
                );

            box-shadow:
                inset 0 0 0 2px rgba(255, 238, 191, 0.3),
                inset 0 0 18px rgba(72, 35, 10, 0.5),
                0 7px 18px rgba(0, 0, 0, 0.4);
        }

        .coin-face::before {
            content: "";

            position: absolute;

            inset: 8px;

            border-radius: 50%;

            border: 1px solid rgba(255, 237, 184, 0.32);

            box-shadow:
                inset 0 0 0 1px rgba(100, 54, 16, 0.28);
        }

        .coin-face::after {
            content: "";

            position: absolute;

            width: 55%;
            height: 55%;

            left: 9%;
            top: 6%;

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255, 255, 255, 0.24),
                    transparent 68%
                );

            transform: rotate(-25deg);

            filter: blur(4px);
        }

        .heads {
            transform: rotateY(0deg) translateZ(1px);
        }

        .tails {
            transform: rotateY(180deg) translateZ(1px);
        }

        .coin-symbol {
            position: relative;

            z-index: 2;

            width: 72px;
            height: 72px;

            border-radius: 50%;

            border:
                2px solid rgba(90, 47, 13, 0.42);

            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(91, 48, 13, 0.78);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 38px;

            font-weight: 700;

            box-shadow:
                inset 0 0 12px rgba(255, 235, 183, 0.2);
        }

        .tails .coin-symbol {
            font-size: 31px;
        }

        /* =========================================================
           COIN EDGE
        ========================================================= */

        .coin-edge {
            position: absolute;

            width: 132px;
            height: 132px;

            left: 0;
            top: 0;

            border-radius: 50%;

            transform:
                rotateY(90deg)
                translateZ(2px);

            border:
                7px solid #8d5925;

            background:
                repeating-linear-gradient(
                    90deg,
                    #b47731 0px,
                    #e1ae62 2px,
                    #86501e 4px,
                    #c98d46 6px
                );

            box-shadow:
                inset 0 0 10px rgba(60, 30, 8, 0.55);
        }

        /* =========================================================
           COIN ANIMATION
        ========================================================= */

        .coin.flip {
            animation:
                coinFlip 3.8s cubic-bezier(0.15, 0.7, 0.18, 1) forwards;
        }

        @keyframes coinFlip {

            0% {
                transform:
                    translateY(100px)
                    rotateX(0deg)
                    rotateY(0deg)
                    rotateZ(0deg)
                    scale(0.7);
            }

            8% {
                transform:
                    translateY(65px)
                    rotateX(90deg)
                    rotateY(35deg)
                    rotateZ(-8deg)
                    scale(0.82);
            }

            20% {
                transform:
                    translateY(-80px)
                    rotateX(540deg)
                    rotateY(115deg)
                    rotateZ(18deg)
                    scale(0.92);
            }

            34% {
                transform:
                    translateY(-205px)
                    rotateX(1050deg)
                    rotateY(225deg)
                    rotateZ(-25deg)
                    scale(0.98);
            }

            48% {
                transform:
                    translateY(-245px)
                    rotateX(1600deg)
                    rotateY(380deg)
                    rotateZ(20deg)
                    scale(1.03);
            }

            62% {
                transform:
                    translateY(-180px)
                    rotateX(2150deg)
                    rotateY(545deg)
                    rotateZ(-13deg)
                    scale(1.01);
            }

            75% {
                transform:
                    translateY(-85px)
                    rotateX(2670deg)
                    rotateY(700deg)
                    rotateZ(7deg)
                    scale(1);
            }

            86% {
                transform:
                    translateY(-12px)
                    rotateX(3060deg)
                    rotateY(810deg)
                    rotateZ(-3deg)
                    scale(0.99);
            }

            94% {
                transform:
                    translateY(4px)
                    rotateX(3300deg)
                    rotateY(900deg)
                    rotateZ(0deg)
                    scale(0.98);
            }

            100% {
                transform:
                    translateY(0)
                    rotateX(3420deg)
                    rotateY(900deg)
                    rotateZ(0deg)
                    scale(1);
            }
        }

        /* =========================================================
           RESULT
        ========================================================= */

        .result {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, calc(-50% + 30px))
                scale(0.96);

            width: min(90vw, 600px);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            z-index: 12;

            opacity: 0;
            pointer-events: none;

            transition:
                opacity 0.8s ease,
                transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .result.visible {
            opacity: 1;
            pointer-events: auto;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        .result-small {
            font-size: 10px;

            letter-spacing: 0.38em;

            text-transform: uppercase;

            color: rgba(243, 238, 229, 0.35);

            margin-bottom: 17px;
        }

        .result-main {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(48px, 9vw, 88px);

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: -0.04em;

            color: #f7f0e4;

            margin-bottom: 20px;
        }

        .result-description {
            max-width: 430px;

            color: rgba(243, 238, 229, 0.52);

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 34px;
        }

        .continue {
            border: 1px solid rgba(243, 238, 229, 0.16);

            background:
                rgba(255, 255, 255, 0.035);

            color: rgba(243, 238, 229, 0.8);

            padding:
                14px 25px;

            border-radius: 100px;

            font-size: 10px;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                transform 0.35s ease,
                background 0.35s ease,
                border-color 0.35s ease,
                color 0.35s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .continue:hover {
            transform: translateY(-3px);

            background:
                rgba(255, 255, 255, 0.075);

            border-color:
                rgba(243, 238, 229, 0.3);

            color: #fffaf0;
        }

        .continue:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* =========================================================
           TRANSITION OVERLAY
        ========================================================= */

        .transition {
            position: fixed;

            inset: 0;

            background: #050504;

            z-index: 100;

            pointer-events: none;

            opacity: 1;

            transition:
                opacity 1s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .transition::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 220, 160, 0.055),
                    transparent 68%
                );

            filter: blur(20px);
        }

        .transition.open {
            opacity: 0;
        }

        .transition.exit {
            opacity: 1;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .content {
                width: 88vw;
            }

            .eyebrow {
                font-size: 9px;
                letter-spacing: 0.34em;
            }

            .title {
                font-size: clamp(42px, 13vw, 62px);
            }

            .subtitle {
                max-width: 330px;
                font-size: 13px;
                margin-bottom: 38px;
            }

            .choice-label {
                font-size: 9px;
                letter-spacing: 0.25em;
            }

            .choices {
                gap: 10px;
            }

            .choice {
                width: 145px;
                height: 54px;
            }

            .coin-camera {
                transform: scale(0.9);
            }

            .result {
                width: 88vw;
            }

            .result-main {
                font-size: clamp(50px, 16vw, 78px);
            }

            .result-description {
                max-width: 330px;
                font-size: 13px;
            }
        }

        @media (max-height: 650px) {

            .subtitle {
                margin-bottom: 28px;
            }

            .choice-label {
                margin-bottom: 12px;
            }

            .coin-camera {
                transform: scale(0.82);
            }
        }

        /* =========================================================
           ACCESSIBILITY
        ========================================================= */

        button:focus-visible {
            outline: 1px solid rgba(255, 215, 150, 0.6);
            outline-offset: 5px;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="scene">

        <div class="ambient-glow"></div>

        <!-- =====================================================
             MAIN CONTENT
        ====================================================== -->

        <main class="content" id="content">

            <div class="eyebrow">
                A little game of chance
            </div>

            <h1 class="title">
                The Coin
            </h1>

            <p class="subtitle">
                You already know what you want it to land on.
                But once the coin is in the air, neither of us gets to decide.
            </p>

            <section class="choice-area">

                <div class="choice-label">
                    Choose your side
                </div>

                <div class="choices">

                    <button
                        class="choice"
                        id="headsChoice"
                        type="button"
                        data-choice="heads"
                    >
                        Heads
                    </button>

                    <button
                        class="choice"
                        id="tailsChoice"
                        type="button"
                        data-choice="tails"
                    >
                        Tails
                    </button>

                </div>

            </section>

        </main>

        <!-- =====================================================
             COIN STAGE
        ====================================================== -->

        <div class="coin-stage" id="coinStage">

            <div class="coin-light"></div>

            <div class="coin-shadow"></div>

            <div class="coin-camera">

                <div class="coin" id="coin">

                    <div class="coin-face heads">
                        <div class="coin-symbol">
                            H
                        </div>
                    </div>

                    <div class="coin-face tails">
                        <div class="coin-symbol">
                            T
                        </div>
                    </div>

                    <div class="coin-edge"></div>

                </div>

            </div>

        </div>

        <!-- =====================================================
             RESULT
        ====================================================== -->

        <section class="result" id="result">

            <div class="result-small" id="resultSmall">
                The coin decided
            </div>

            <div class="result-main" id="resultMain">
                Heads
            </div>

            <p class="result-description" id="resultDescription">
                The universe had other plans.
            </p>

            <button
                class="continue"
                id="continueButton"
                type="button"
            >
                Continue
            </button>

        </section>

        <div class="vignette"></div>

        <div class="transition" id="transition"></div>

    </div>

    <script>
        /* =========================================================
           ELEMENTS
        ========================================================= */

        const content = document.getElementById("content");

        const headsChoice = document.getElementById("headsChoice");
        const tailsChoice = document.getElementById("tailsChoice");

        const coinStage = document.getElementById("coinStage");
        const coin = document.getElementById("coin");

        const result = document.getElementById("result");
        const resultSmall = document.getElementById("resultSmall");
        const resultMain = document.getElementById("resultMain");
        const resultDescription = document.getElementById("resultDescription");

        const continueButton = document.getElementById("continueButton");

        const transition = document.getElementById("transition");


        /* =========================================================
           STATE
        ========================================================= */

        let selectedChoice = null;
        let resultChoice = null;
        let flipping = false;


        /* =========================================================
           PAGE LOAD
        ========================================================= */

        window.addEventListener("load", () => {

            requestAnimationFrame(() => {
                transition.classList.add("open");
            });

        });


        /* =========================================================
           CHOICE SELECTION
        ========================================================= */

        headsChoice.addEventListener("click", () => {
            chooseSide("heads");
        });

        tailsChoice.addEventListener("click", () => {
            chooseSide("tails");
        });


        function chooseSide(choice) {

            if (flipping) {
                return;
            }

            selectedChoice = choice;

            headsChoice.classList.remove("selected");
            tailsChoice.classList.remove("selected");

            if (choice === "heads") {
                headsChoice.classList.add("selected");
            } else {
                tailsChoice.classList.add("selected");
            }

            setTimeout(() => {
                beginFlip();
            }, 450);
        }


        /* =========================================================
           COIN FLIP
        ========================================================= */

        function beginFlip() {

            if (flipping) {
                return;
            }

            flipping = true;

            /*
             * =====================================================
             * TRUE 50 / 50 RESULT
             * =====================================================
             *
             * The user's choice has NO influence on the result.
             *
             * Math.random() produces a value from 0 (inclusive)
             * up to 1 (exclusive).
             *
             * Below 0.5  -> Heads
             * 0.5 or above -> Tails
             *
             * Therefore:
             *
             * Heads = 50%
             * Tails = 50%
             *
             * =====================================================
             */

            resultChoice =
                Math.random() < 0.5
                    ? "heads"
                    : "tails";


            /* =====================================================
               HIDE THE ORIGINAL CONTENT
            ===================================================== */

            content.style.opacity = "0";

            content.style.transform =
                "translateY(-20px) scale(0.98)";


            /* =====================================================
               ACTIVATE COIN STAGE
            ===================================================== */

            setTimeout(() => {

                coinStage.classList.add("active");

                coin.classList.add("show");

                /*
                 * Force browser to register the initial state
                 * before restarting the animation.
                 */

                void coin.offsetWidth;

                coin.classList.add("flip");

            }, 500);


            /* =====================================================
               SHOW RESULT AFTER FLIP
            ===================================================== */

            setTimeout(() => {

                showResult();

            }, 4000);
        }


        /* =========================================================
           RESULT
        ========================================================= */

        function showResult() {

            coinStage.classList.remove("active");

            coinStage.classList.add("hidden");


            /*
             * Give the coin stage a moment to fade before
             * revealing the result.
             */

            setTimeout(() => {

                resultMain.textContent =
                    resultChoice === "heads"
                        ? "Heads"
                        : "Tails";


                /*
                 * User got what they chose.
                 */

                if (resultChoice === selectedChoice) {

                    resultSmall.textContent =
                        "The coin agreed";

                    resultDescription.textContent =
                        "Looks like chance was on your side.";

                }

                /*
                 * User did NOT get what they chose.
                 */

                else {

                    resultSmall.textContent =
                        "The coin decided";

                    resultDescription.textContent =
                        "You chose one thing. Fate chose another.";

                }


                result.classList.add("visible");

            }, 500);
        }


        /* =========================================================
           CONTINUE
        ========================================================= */

        continueButton.addEventListener("click", () => {

            if (transition.classList.contains("exit")) {
                return;
            }

            transition.classList.add("exit");

            setTimeout(() => {

                /*
                 * Page 21 gateway navigation.
                 *
                 * The page that opened this coin page is read
                 * from the URL parameter "from".
                 */

                const params = new URLSearchParams(
                    window.location.search
                );

                const from =
                    parseInt(params.get("from"), 10);


                /*
                 * Page navigation:
                 *
                 * Page 1  -> Page 21 -> Page 2
                 * Page 2  -> Page 21 -> Page 3
                 * ...
                 * Page 19 -> Page 21 -> Page 20
                 *
                 * Page 20 does not use this gateway.
                 */

                if (!Number.isNaN(from)) {

                    const nextPage = from + 1;

                    window.location.href =
                        `page${nextPage}.html`;

                } else {

                    /*
                     * Fallback if the page is opened directly.
                     */

                    window.location.href =
                        "page2.html";
                }

            }, 1000);

        });


        /* =========================================================
           PREVENT ACCIDENTAL DOUBLE ACTIVATION
        ========================================================= */

        window.addEventListener("keydown", (event) => {

            if (
                event.key === "Enter" &&
                !flipping &&
                selectedChoice
            ) {

                beginFlip();

            }

        });


        /* =========================================================
           RESET ANIMATION STATE IF PAGE IS REUSED
        ========================================================= */

        window.addEventListener("pageshow", () => {

            if (
                !window.location.hash &&
                !flipping
            ) {

                coin.classList.remove("flip");
                coin.classList.remove("show");

                coinStage.classList.remove("active");
                coinStage.classList.remove("hidden");

                result.classList.remove("visible");

                headsChoice.classList.remove("selected");
                tailsChoice.classList.remove("selected");

                selectedChoice = null;
                resultChoice = null;
                flipping = false;
            }

        });

    </script>

</body>
</html>
